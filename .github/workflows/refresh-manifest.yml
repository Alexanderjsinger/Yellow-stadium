name: Refresh canonical manifest

on:
  push:
    branches:
      - repair/source-owner-battle-stability

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/source-owner-battle-stability
      - name: Refresh hashes and canonical build
        run: python tools/refresh_manifest.py
      - name: Commit generated canonical state
        run: |
          if git diff --quiet -- manifest.json dist/index.html; then
            echo "Canonical state already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json dist/index.html
          git commit -m "Refresh canonical build fingerprints [skip refresh]"
          git push
