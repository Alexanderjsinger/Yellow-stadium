name: Promote Yellow Stadium UI-5.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Materialize UI-5.2 source
        shell: bash
        run: |
          curl -fsSL 'https://yellow-stadium-v4-refactor.floot.app/_cdn/static/2d8a7c5d-3c53-45ba-9e9b-d6fa8907778a-ui52_release_payload.txt' -o /tmp/ui52.b64
          python - <<'PY'
          from pathlib import Path
          import base64,bz2,json
          packed=''.join(Path('/tmp/ui52.b64').read_text().split())
          payload=json.loads(bz2.decompress(base64.b64decode(packed)))
          for rel,body in payload['files'].items():
              p=Path(rel)
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(body,encoding='utf-8',newline='')
          print('materialized',len(payload['files']),'release files')
          PY
          rm -rf .release
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Full canonical regression gate
        run: npm test
      - name: Restore normal CI
        shell: bash
        run: |
          cat > .github/workflows/ci.yml <<'YAML'
          name: Yellow Stadium regression gate

          on:
            push:
            pull_request:

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                    cache: 'npm'
                - name: Install build dependencies
                  run: npm ci
                - name: Full canonical regression gate
                  run: npm test
                - name: Upload regression evidence
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: yellow-stadium-regression-reports
                    path: reports/
                    if-no-files-found: error
          YAML
      - name: Commit validated release to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Promote UI-5.2 tutorial fix and facelift [skip ci]'
          git push origin HEAD:main
