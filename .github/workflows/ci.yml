name: Promote Yellow Stadium UI-5.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Materialize verified UI-5.2 source
        shell: bash
        run: |
          set -euo pipefail
          count=$(find .release -maxdepth 1 -name 'ui52x-*.txt' | wc -l | tr -d ' ')
          test "$count" -eq 17
          cat .release/ui52x-*.txt > /tmp/ui52.b64
          python - <<'PY'
          from pathlib import Path
          import base64,bz2,json,hashlib
          packed=''.join(Path('/tmp/ui52.b64').read_text().split())
          expected_packed='675af364da2e1163bb9c4892711007d3018fad4341be7b3272e5cf078b7357e4'
          expected_raw='44cd746661d04cff705627a9af157c604363582f11f2a63738568fe785d98387'
          if hashlib.sha256(packed.encode()).hexdigest() != expected_packed:
              raise SystemExit('UI-5.2 base64 payload hash mismatch')
          raw=base64.b64decode(packed)
          if hashlib.sha256(raw).hexdigest() != expected_raw:
              raise SystemExit('UI-5.2 compressed payload hash mismatch')
          payload=json.loads(bz2.decompress(raw))
          if len(payload.get('files',{})) != 42:
              raise SystemExit('UI-5.2 release file count mismatch')
          for rel,body in payload['files'].items():
              p=Path(rel)
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(body,encoding='utf-8',newline='')
          print('materialized',len(payload['files']),'verified release files')
          PY
          rm -rf .release
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Full canonical regression gate
        run: npm test
      - name: Build production artifact
        run: python tools/build.py
      - name: Promote validated UI-5.2 to main
        shell: bash
        run: |
          set -euo pipefail
          cp dist/index.html index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Promote UI-5.2 tutorial fix and visual facelift [skip ci]'
          git push origin HEAD:main
