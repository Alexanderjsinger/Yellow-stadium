name: Materialize G2.1 release

on:
  push:
    branches: [g2-1-release]
    paths:
      - '.release/**'
      - '.github/workflows/materialize-g21.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g2-1-release
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Expand canonical G2.1 source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .release/g2-1-source.tar.gz.b64 > /tmp/g2-1-source.tar.gz
          tar -xzf /tmp/g2-1-source.tar.gz -C .

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Rehydrate immutable RC8 golden and E2 live assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, base64, hashlib
          names=[f'part-{i:03d}.txt' for i in range(12)] + [f'part-012-{i:02d}.txt' for i in range(6)] + ['part-013.txt','part-014.txt'] + [f'part-015-{i:02d}.txt' for i in range(6)]
          raw=''.join((Path('payload')/n).read_text(encoding='utf-8') for n in names)
          Path('golden').mkdir(exist_ok=True)
          Path('golden/index.rc8.html').write_text(raw,encoding='utf-8',newline='')
          marker='window.STADIUM_ASSETS='
          start=raw.find(marker); end=raw.find(';</script>',start)
          if start < 0 or end < 0: raise SystemExit('STADIUM_ASSETS not found')
          archive=json.loads(raw[start+len(marker):end])
          golden={}
          for key,val in archive.items():
              if not (isinstance(val,str) and ';base64,' in val): continue
              head,b64=val.split(';base64,',1)
              data=base64.b64decode(b64)
              rel=key[2:] if key.startswith('./') else key
              golden[key]={'bytes':len(data),'mime':head.split('data:',1)[1] if head.startswith('data:') else 'application/octet-stream','path':rel,'sha256':hashlib.sha256(data).hexdigest()}
          Path('golden/asset-manifest.rc8.json').write_text(json.dumps(golden,indent=2,sort_keys=True)+'\n')
          live=json.loads(Path('public/asset-manifest.json').read_text())
          for key,meta in live.items():
              val=archive.get(key)
              if not isinstance(val,str) or ';base64,' not in val: raise SystemExit(f'missing {key}')
              data=base64.b64decode(val.split(';base64,',1)[1])
              if hashlib.sha256(data).hexdigest()!=meta['sha256']: raise SystemExit(f'hash mismatch {key}')
              rel=key[2:] if key.startswith('./') else key
              p=Path('public')/rel
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(data)
          print('rehydrated',len(golden),'golden assets and',len(live),'live assets')
          PY

      - name: Restore E2 regression evidence
        shell: bash
        run: |
          mkdir -p reports
          cat > reports/e2-asset-demand.json <<'JSON'
          {
            "pruned_asset_count": 356,
            "pruned_asset_bytes": 143283
          }
          JSON

      - name: Install and test
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Materialize root static deploy
        shell: bash
        run: |
          set -euo pipefail
          cp dist/index.html index.html
          rm -rf assets
          cp -a dist/assets assets
          cp dist/asset-manifest.json asset-manifest.json
          cp dist/asset-groups.json asset-groups.json

      - name: Commit canonical source and deploy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized changes"
          else
            git commit -m "Promote G2.1 canonical build"
            git push origin HEAD:g2-1-release
          fi
